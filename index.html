.ltab{width:100%;border-collapse:collapse;margin-top:7px;font-size:12px}.ltab th{text-align:left;color:#7fe0a5;font-weight:400;font-size:10px;border-bottom:1px solid #2f6b4a;padding:2px 3px}
.ltab td{padding:4px 3px;border-bottom:1px solid #22382c;vertical-align:top}.ltab td:first-child{white-space:nowrap;color:#9fc8b0}.ltab .lp{white-space:nowrap;text-align:right;font-weight:700}
.lk{font-size:10px;padding:1px 5px;border-radius:6px;white-space:nowrap}.lk-r{background:#24406a;color:#bcd6ff}.lk-m{background:#5a3a16;color:#ffd59a}.lk-h{background:#3a2a5a;color:#d8c4ff}
.lsum{margin-top:6px;font-size:12px;color:#cfe8d8}
.bu{margin-top:9px;border-top:1px dashed #2f6b4a;padding-top:7px}.bu>small{display:block;color:#7fe0a5;font-size:11px}
.butabs{display:flex;gap:6px;margin:5px 0 2px}.butab{flex:1;background:#1d3328;color:#cfe8d8;border:1px solid #2f6b4a;border-radius:7px;padding:4px 0;font-size:12px;font-family:inherit}.butab.on{background:#2f6b4a;color:#fff;font-weight:700}
.bulg{display:flex;gap:8px;margin:5px 0 2px;font-size:10px}.bu em{font-style:normal;padding:0 5px;border-radius:6px;margin-right:4px;white-space:nowrap}
.bu .sc{background:#1f5a3a;color:#a8f0c4}.bu .sr{background:#3a2a5a;color:#d8c4ff}.bu .sx{background:#24406a;color:#bcd6ff}
.buday{margin-top:6px;background:#1a2d23;border-radius:8px;padding:4px 7px}.buday summary{display:flex;align-items:baseline;gap:6px;cursor:pointer;font-size:12px;color:#cfe8d8}.buday summary span{flex:1;font-weight:700}.buday summary b{color:#ffd59a}.buday summary small{font-size:10px;color:#8fb8a0}
.burow{margin-top:5px}.bun{display:flex;font-size:12px}.bun span{flex:1}.bun b{white-space:nowrap}
.bubar{display:flex;height:7px;background:#24362c;border-radius:4px;overflow:hidden;margin-top:2px}.bubar i{display:block;height:100%}.bubar .bc{background:#3ccf7a}.bubar .br{background:#a98bff}.bubar .bx{background:#5b9bff}
.busrc{font-size:10px;color:#8fb8a0;margin-top:2px}
.burt{margin-top:6px;border-top:1px solid #22382c;padding-top:4px;font-size:11px}.burt small{display:block;font-size:10px;color:#7fe0a5}.burt div{display:flex;gap:6px;padding:1px 0}.burt span{flex:1}.burt i{font-style:normal;color:#8fb8a0;font-size:10px}
.buwk{margin-top:6px;background:#1a2d23;border-radius:8px;padding:3px 7px 5px}.buper{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}.buper span{font-size:10px;background:#24362c;border-radius:5px;padding:0 4px;color:#cfe8d8}
.buna{margin-top:7px;font-size:10px;color:#8fb8a0}.buna small{color:#e9a23b;font-size:10px}
#recap{display:none;position:fixed;inset:0;z-index:60;background:rgba(10,8,6,.55);overflow:auto;padding:24px 12px}
#recap.show{display:block}
.rpaper{position:relative;max-width:420px;margin:0 auto;background:#fffdf4;color:#2a2620;border-radius:4px;padding:18px 18px 14px;box-shadow:0 8px 30px rgba(0,0,0,.5);font-size:13px;line-height:1.5;background-image:repeating-linear-gradient(#fffdf4 0 25px,#ece6d6 25px 26px);animation:rslide .5s ease-out}
@keyframes rslide{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}
.rpaper h3{margin:0;font-size:19px;letter-spacing:1px;border-bottom:2px dashed #b9ae94;padding-bottom:6px}
.rsub{font-size:11px;color:#7a705c;margin-top:4px}
.rsec{margin-top:10px}.rsec h4{margin:0 0 3px;font-size:12px;color:#8a5a2b}
.rbot{margin:3px 0}.rbot b{display:inline-block;min-width:70px}.rbot>div{display:inline}.rbot ul{margin:2px 0 4px 18px;padding:0}.rbot li{margin:1px 0}
.rnone{color:#9a917c}.rfoot{margin-top:12px;text-align:center;font-size:11px;color:#9a917c}
.rclose{position:absolute;right:10px;top:10px;border:0;background:#e9e1cc;border-radius:50%;width:28px;height:28px;font-size:14px;cursor:pointer;color:#2a2620}
.tag u.age{text-decoration:none;font-size:8.5px;color:#cfe3d0;background:rgba(20,18,24,.72);padding:0 4px;border-radius:4px;margin-top:1px;white-space:nowrap}
.tag u.age.old{color:#ffd98a}.tag.stale b{opacity:.6}

#strip .sg{display:flex;flex-wrap:wrap;align-items:center;gap:3px}
#strip .sl{border:1px solid;border-radius:10px;padding:0 7px;font-weight:700;white-space:nowrap}
#strip .sn{background:#221e18;border:1px solid #5a4a30;color:#eee;border-radius:7px;padding:1px 6px;font-size:11.5px;cursor:pointer}
#strip .snone{color:#8a7e68;font-size:11px}
.oldtag{font-size:10px;background:#3a3122;color:#ffd98a;border:1px solid #8a7a5a;border-radius:6px;padding:0 5px;margin-left:4px}
.tag u.age em{font-style:normal;display:inline;padding:0;margin:0;background:none;border:0;width:auto;height:auto;position:static}.tag u.age .ags{display:none}
