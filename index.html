.rpaper{position:relative;max-width:420px;margin:0 auto;background:#fffdf4;color:#2a2620;border-radius:4px;padding:18px 18px 14px;box-shadow:0 8px 30px rgba(0,0,0,.5);font-size:13px;line-height:1.5;background-image:repeating-linear-gradient(#fffdf4 0 25px,#ece6d6 25px 26px);animation:rslide .5s ease-out}
@keyframes rslide{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}
.rpaper h3{margin:0;font-size:19px;letter-spacing:1px;border-bottom:2px dashed #b9ae94;padding-bottom:6px}
.rsub{font-size:11px;color:#7a705c;margin-top:4px}
.rsec{margin-top:10px}.rsec h4{margin:0 0 3px;font-size:12px;color:#8a5a2b}
.rbot{margin:3px 0}.rbot b{display:inline-block;min-width:70px}.rbot>div{display:inline}.rbot ul{margin:2px 0 4px 18px;padding:0}.rbot li{margin:1px 0}
.rnone{color:#9a917c}.rfoot{margin-top:12px;text-align:center;font-size:11px;color:#9a917c}
.rclose{position:absolute;right:10px;top:10px;border:0;background:#e9e1cc;border-radius:50%;width:28px;height:28px;font-size:14px;cursor:pointer;color:#2a2620}
.tag u.age{text-decoration:none;font-size:8.5px;color:#cfe3d0;background:rgba(20,18,24,.72);padding:0 4px;border-radius:4px;margin-top:1px;white-space:nowrap}
.tag u.age.old{color:#ffd98a}.tag.stale b{opacity:.6}
#strip{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px;font-size:12px}
#strip .sg{display:flex;flex-wrap:wrap;align-items:center;gap:3px}
#strip .sl{border:1px solid;border-radius:10px;padding:0 7px;font-weight:700;white-space:nowrap}
#strip .sn{background:#221e18;border:1px solid #5a4a30;color:#eee;border-radius:7px;padding:1px 6px;font-size:11.5px;cursor:pointer}
#strip .snone{color:#8a7e68;font-size:11px}
.oldtag{font-size:10px;background:#3a3122;color:#ffd98a;border:1px solid #8a7a5a;border-radius:6px;padding:0 5px;margin-left:4px}
.tag u.age em{font-style:normal;display:inline;padding:0;margin:0;background:none;border:0;width:auto;height:auto;position:static}.tag u.age .ags{display:none}
@media (max-width:899px){.tag u.age{padding:0 3px;margin:0 0 0 2px;align-self:center}.tag u.age .agl{display:none}.tag u.age .ags{display:inline}}
#handin{display:none;position:fixed;inset:0;z-index:60;background:rgba(10,8,6,.55);overflow:auto;padding:24px 12px}#handin.show{display:block}
#handin .hb{margin-top:10px;border-top:1px dashed #cfc4a8;padding-top:6px}#handin .hn{background:#2a2620;color:#ffe08a;border:0;border-radius:7px;padding:2px 9px;font-weight:700;cursor:pointer;font-size:13px}
#handin .hb small{margin-left:8px;color:#7a705c;font-size:11px}#handin ul{margin:4px 0 0 18px;padding:0}#handin li span{display:block;font-size:11px;color:#8a5a2b}.hnone{margin-top:12px;color:#7a705c}
